name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-addon:
    name: Validate Apps Script add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate appsscript.json is valid JSON
        run: |
          python3 -c "import json; json.load(open('apps-script/appsscript.json')); print('appsscript.json OK')"

      - name: Syntax-check .gs files (parsed as JavaScript)
        run: |
          fail=0
          for f in apps-script/*.gs; do
            # .gs は V8 ランタイムのJavaScript。node --check で構文チェックする
            cp "$f" "/tmp/$(basename "$f").js"
            if node --check "/tmp/$(basename "$f").js"; then
              echo "OK: $f"
            else
              echo "SYNTAX ERROR: $f"; fail=1
            fi
          done
          exit $fail
