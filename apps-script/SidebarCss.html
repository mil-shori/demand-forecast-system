<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: #202124; margin: 0; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 12px 0; }
  .muted { color: #5f6368; }
  .small { font-size: 11px; }
  .hidden { display: none; }

  .tabs { display: flex; border-bottom: 1px solid #dadce0; margin-bottom: 12px; }
  .tab { flex: 1; background: none; border: none; padding: 8px 4px; cursor: pointer; font-size: 12px; color: #5f6368; border-bottom: 2px solid transparent; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: bold; }

  label { display: block; margin: 8px 0; font-size: 12px; color: #3c4043; }
  input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; }

  button { border: none; border-radius: 4px; padding: 8px 12px; margin: 6px 4px 6px 0; cursor: pointer; font-size: 13px; }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-secondary { background: #f1f3f4; color: #3c4043; }
  .btn-ai { background: #e8f0fe; color: #1967d2; }
  button:disabled { opacity: 0.5; cursor: default; }

  .banner { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; }
  .banner.ok { background: #e6f4ea; color: #137333; }
  .banner.err { background: #fce8e6; color: #c5221f; }
  .banner.info { background: #e8f0fe; color: #1967d2; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11px; }
  th, td { border: 1px solid #e0e0e0; padding: 4px 6px; text-align: left; }
  th { background: #f8f9fa; }
  .status-synced { color: #137333; }
  .status-failed { color: #c5221f; }
  .status-skipped, .status-pending { color: #5f6368; }
  .summary-box { background: #f8f9fa; border-radius: 4px; padding: 10px; margin-top: 8px; white-space: pre-wrap; font-size: 12px; line-height: 1.5; }
  .ai-box { background: #e8f0fe; border-radius: 4px; padding: 8px; margin-top: 8px; font-size: 12px; }
</style>
