[flake8]
# blackのフォーマット（行長88、スライス前後の空白、行頭の二項演算子）と整合させる
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .venv,
    __pycache__,
    .pytest_cache
per-file-ignores =
    # alembic標準のテンプレート由来（target_metadata用のモデル一括import等）
    alembic/env.py: E402, F401, F403
    alembic/versions/*.py: F401

[isort]
profile = black
skip_glob = .venv/*
