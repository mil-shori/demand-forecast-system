version: '3.8'

services:
  # PostgreSQL データベース
  db:
    image: postgres:15
    container_name: demand-forecast-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: demand_forecast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - demand-forecast-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (キャッシュ・セッション管理用)
  redis:
    image: redis:7-alpine
    container_name: demand-forecast-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - demand-forecast-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # バックエンド API (開発用)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: demand-forecast-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/demand_forecast
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production-12345678901234567890
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    networks:
      - demand-forecast-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # フロントエンド (開発用)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: demand-forecast-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules  # node_modulesをバインドマウントから除外
    networks:
      - demand-forecast-network
    depends_on:
      - backend
    command: npm run dev

  # Nginx (本番用リバースプロキシ)
  nginx:
    image: nginx:alpine
    container_name: demand-forecast-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./data/ssl:/etc/nginx/ssl
    networks:
      - demand-forecast-network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

  # Jupyter Notebook (データ分析用)
  jupyter:
    build:
      context: ./notebooks
      dockerfile: Dockerfile
    container_name: demand-forecast-jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/demand_forecast
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/work/data
      - ./backend:/home/jovyan/work/backend
    networks:
      - demand-forecast-network
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - analysis
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

  # Prometheus (監視用)
  prometheus:
    image: prom/prometheus:latest
    container_name: demand-forecast-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - demand-forecast-network
    profiles:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana (ダッシュボード用)
  grafana:
    image: grafana/grafana:latest
    container_name: demand-forecast-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - demand-forecast-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  demand-forecast-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local