# Netlify Configuration File for Demand Forecast System
# 需要予測システム - Netlifyビルド設定

[build]
  # ベースディレクトリ
  base = "frontend/"
  
  # ビルドコマンド
  command = "npm ci && npm run build"
  
  # パブリッシュディレクトリ
  publish = "frontend/dist"

[build.environment]
  # Node.js バージョン
  NODE_VERSION = "18.17.0"
  
  # npm バージョン
  NPM_VERSION = "9.6.7"
  
  # ビルド環境変数
  NODE_ENV = "production"
  
  # Viteビルド最適化
  VITE_BUILD_OPTIMIZATION = "true"

# 本番環境用設定
[context.production]
  command = "npm ci --only=production && npm run build"
  
  [context.production.environment]
    NODE_ENV = "production"
    VITE_API_BASE_URL = "https://api.demand-forecast.example.com"
    VITE_APP_VERSION = "$COMMIT_REF"
    VITE_ENVIRONMENT = "production"

# プレビュー環境用設定（プルリクエスト）
[context.deploy-preview]
  command = "npm ci && npm run build"
  
  [context.deploy-preview.environment]
    NODE_ENV = "development"
    VITE_API_BASE_URL = "https://staging-api.demand-forecast.example.com"
    VITE_APP_VERSION = "$COMMIT_REF"
    VITE_ENVIRONMENT = "preview"

# ブランチデプロイ用設定（develop branch）
[context.branch-deploy]
  command = "npm ci && npm run build"
  
  [context.branch-deploy.environment]
    NODE_ENV = "development"
    VITE_API_BASE_URL = "https://dev-api.demand-forecast.example.com"
    VITE_APP_VERSION = "$COMMIT_REF"
    VITE_ENVIRONMENT = "development"

# リダイレクト設定（SPA用）
[[redirects]]
  from = "/api/*"
  to = "https://api.demand-forecast.example.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ヘッダー設定
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# フォームハンドリング（将来の拡張用）
# [[forms]]
#   name = "contact"

# エッジファンクション設定（将来の拡張用）
# [[edge_functions]]
#   function = "hello"
#   path = "/api/hello"

# プラグイン設定
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

[[plugins]]
  package = "netlify-plugin-submit-sitemap"

  [plugins.inputs]
    baseUrl = "https://demand-forecast.example.com"
    sitemapPath = "/sitemap.xml"
    providers = [
      "google",
      "bing"
    ]

# 関数設定（将来のNetlify Functions用）
[functions]
  directory = "functions/"

# 開発用設定
[dev]
  command = "npm run dev"
  port = 3000
  publish = "frontend/dist"
  autoLaunch = true